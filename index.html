<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f3f6f3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d1411" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="A local-first workspace for building and scaling a business."
    />
    <title>N100M Business Builder</title>
    <script>
      // Apply a saved light/dark choice before first paint to avoid a flash.
      // This is only a cache; the setting itself lives in the storage layer.
      try {
        var t = localStorage.getItem('n100m.theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
