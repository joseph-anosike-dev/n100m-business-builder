name: Android debug APK

# Builds a DEBUG APK signed with a persistent debug keystore (repository secret DEBUG_KEYSTORE_BASE64) on
# every push to main and uploads it as a workflow artifact, so successive APKs install as updates. No release signing, no Play Store, no Android Studio.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # The Gradle wrapper is not committed, so the workflow installs the
      # Gradle version the Android project was written for (Capacitor 7).
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Web production build
        run: npx vite build

      - name: Sync web build into the Android project
        run: npx cap sync android

      # Restore the persistent DEBUG keystore to the Android Gradle Plugin's standard location
      # (~/.android/debug.keystore), which the default debug signing config uses. Debug use only:
      # never use this key for release signing. Fails rather than letting Gradle generate a new key.
      - name: Restore persistent debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error title=Missing secret DEBUG_KEYSTORE_BASE64::Repository secret DEBUG_KEYSTORE_BASE64 is not set. Without it each build would get a new random debug key and APKs could not update each other. Create it under Settings > Secrets and variables > Actions (see PROJECT_STATE.md for the steps)."
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$HOME/.android/debug.keystore"
          if ! keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey > /dev/null 2>&1; then
            rm -f "$HOME/.android/debug.keystore"
            echo "::error title=Invalid debug keystore::DEBUG_KEYSTORE_BASE64 did not decode to a keystore with alias androiddebugkey and store password android. Regenerate it (see PROJECT_STATE.md)."
            exit 1
          fi

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: n100m-business-builder-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
